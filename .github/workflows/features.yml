name: Fork Erlang-source features
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Read the tested ELP baseline
        id: upstream
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          from urllib.parse import urlparse
          baseline = json.loads(Path('upstream.json').read_text())
          assert baseline['schema_version'] == 1
          repository = urlparse(baseline['repository'])
          assert repository.scheme == 'https' and repository.netloc == 'github.com'
          slug = repository.path.strip('/').removesuffix('.git')
          assert re.fullmatch(r'[\w.-]+/[\w.-]+', slug)
          tested = baseline['tested_elp']
          assert re.fullmatch(r'[0-9a-f]{40}', tested['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + slug, file=output)
              print('commit=' + tested['commit'], file=output)
              print('otp=' + tested['otp'], file=output)
          PYTHON
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.upstream.outputs.otp }}
          rebar3-version: '3.24.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Check out the pinned ELP source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          path: .upstream-elp
          persist-credentials: false
      - name: Build the fork and test its runner
        run: make build test-runner test-sync
      # Build the exact release source for OTP 27, including its parser/protocol
      # changes, instead of relying on a binary built for another OTP major.
      - name: Build the pinned ELP release
        shell: bash
        working-directory: .upstream-elp
        env:
          ELP_EQWALIZER_PATH: ${{ github.workspace }}/eqwalizer/target/scala-3.6.4/eqwalizer-strict.jar
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          cargo build --locked -p elp --bin elp
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Run literate Erlang examples
        run: python3 tests/exhaustiveness/run.py --keep-workdir
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: feature-test-diagnostics
          path: /tmp/eqwalizer-source-features-*
