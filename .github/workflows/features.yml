name: Fork Erlang-source features
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4.1'
          rebar3-version: '3.24.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Check out the pinned ELP source
        uses: actions/checkout@v4
        with:
          repository: WhatsApp/erlang-language-platform
          ref: 45a9286a9ebb09c04b1daa77834ca9833fb4b0dd
          path: .upstream-elp
          persist-credentials: false
      - name: Build the fork and test its runner
        run: make build test-runner
      # This release had no binary assets when synchronized. Build the exact
      # source revision instead of silently testing against an older ELP release.
      - name: Build the pinned ELP release
        shell: bash
        working-directory: .upstream-elp
        env:
          ELP_EQWALIZER_PATH: ${{ github.workspace }}/eqwalizer/target/scala-3.6.4/eqwalizer-strict.jar
          SOURCE_DATE_EPOCH: '1794844273'
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo build --locked -p elp --bin elp
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Run literate Erlang examples
        run: python3 tests/exhaustiveness/run.py --keep-workdir
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: feature-test-diagnostics
          path: /tmp/eqwalizer-source-features-*
