name: eqWAlizer standalone CI
on:
  push: {}
  pull_request: {}
jobs:
  scala:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run Scala regression tests and assemble checker
        working-directory: eqwalizer
        run: sbt test assembly
      - name: Validate checker process and synthetic IPC
        run: python3 scripts/ipc-smoke.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: eqwalizer-strict.jar
          path: eqwalizer/target/scala-3.6.4/eqwalizer-strict.jar
